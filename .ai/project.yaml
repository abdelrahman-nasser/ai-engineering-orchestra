schema_version: "0.1"

project:
  id: ai-engineering-orchestra
  name: AI Engineering Orchestra
  type: framework
  lifecycle: greenfield

orchestra:
  version: "0.1.0"

complexity:
  default: medium

risk:
  default: medium

execution:
  default_mode: standard

human_control:
  final_review_required: true
  architecture_changes_require_approval: true
  breaking_schema_changes_require_approval: true
  breaking_contract_changes_require_approval: true

quality:
  require_independent_review: true
  require_documentation_consistency: true

agents:
  max_parallel: 3
  max_depth: 2

context:
  strategy: progressive
  prefer_relevant_only: true

project_rules:
  directory: ".ai/rules/"

tasks:
  directory: ".ai/tasks/"

verification:
  checks:
    - id: unit-tests
      command:
        - python
        - -B
        - -m
        - unittest
        - discover
        - -s
        - tests
        - -p
        - "test_*.py"
        - -v
    - id: task-validator
      command:
        - python
        - -B
        - schemas/tests/validate_task.py
    - id: workflow-validator
      command:
        - python
        - -B
        - schemas/tests/validate_workflow.py
    - id: role-validator
      command:
        - python
        - -B
        - schemas/tests/validate_role.py
    - id: manifest-validator
      command:
        - python
        - -B
        - schemas/tests/validate_project_manifest.py
    - id: markdown-lint
      command:
        - npx
        - --yes
        - markdownlint-cli2
        - "**/*.md"
    - id: git-diff-check
      command:
        - git
        - diff
        - --check

overrides:
  directory: ".ai/overrides/"
