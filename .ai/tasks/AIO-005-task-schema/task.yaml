id: AIO-005

title: Define Task Schema

type: implementation

status: completed

version_target: "0.1.0"

complexity: high
risk: medium

execution:
  mode: standard

objective: >
  Implement a machine-readable schema for the canonical v0.1 Task contract
  defined by core/task-specification.md and provide repository-local validation
  coverage for canonical and representative Task configurations.

scope:
  include:
    - Task JSON Schema
    - required top-level fields
    - allowed Task status values
    - Complexity validation
    - Risk validation
    - Execution Mode validation
    - scope validation
    - dependency validation
    - Quality Gate identifier structure
    - Human control validation
    - unknown top-level field rejection
    - canonical Task template validation
    - existing Orchestra Task validation
    - valid Task fixtures
    - invalid Task fixtures
    - repository-local schema validation tooling

  exclude:
    - CLI Task creation
    - CLI validation commands
    - automatic Task decomposition
    - automatic Agent assignment
    - model routing
    - quota handling
    - command permission enforcement
    - Provider Adapter implementation
    - Stack Module implementation
    - Brownfield automated discovery
    - package distribution

dependencies:
  - AIO-004

quality_gates:
  - documentation_consistency
  - independent_review

human_control:
  final_review_required: true
  breaking_schema_changes_require_approval: true
  breaking_contract_changes_require_approval: true
