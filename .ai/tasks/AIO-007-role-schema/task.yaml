id: AIO-007

title: Define Role Schema

type: implementation

status: completed

version_target: "0.1.0"

complexity: high
risk: medium

execution:
  mode: standard

objective: >
  Implement a machine-readable JSON Schema for the canonical v0.1 normalized
  Role contract defined by core/role-specification.md and provide
  repository-local validation coverage for canonical Role projections and
  representative Role configurations.

scope:
  include:
    - Role JSON Schema
    - required top-level fields
    - optional applicable_task_types field
    - scalar type validation
    - array type validation
    - unknown top-level field rejection
    - test-only repository-local Markdown projection extraction
    - canonical Role Markdown projection validation
    - extraction failure tests
    - valid Role fixtures
    - invalid Role fixtures
    - repository-local schema validation tooling
    - canonical Task validation registration for AIO-007

  exclude:
    - Markdown as public runtime Role serialization format
    - public or reusable Role parser or CLI contract
    - unapproved array constraints (minItems, uniqueItems)
    - unapproved identifier regexes or vocabulary enums
    - Task schema changes
    - Task-to-Role assignment
    - Agent implementation
    - Human or Agent identity management
    - Assignment Contract implementation
    - Execution Contract implementation
    - Provider integrations or adapters
    - model routing
    - prompts or personas
    - runtime tools or permissions
    - Workflow definitions or execution
    - approval authority or Human Approver Role
    - separation-of-duties enforcement
    - package distribution

dependencies:
  - AIO-006

quality_gates:
  - documentation_consistency
  - independent_review

human_control:
  final_review_required: true
  breaking_schema_changes_require_approval: true
  breaking_contract_changes_require_approval: true

