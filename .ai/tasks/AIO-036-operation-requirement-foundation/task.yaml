id: AIO-036
title: Establish Operation Requirement Foundation
type: implementation
status: completed
version_target: "0.1.0"
complexity: high
risk: medium
execution:
  mode: deep
workflow: architecture-change
objective: >
  Define and implement the canonical Operation Requirement value contract and
  deterministic lexical-only validation for one Core-defined abstract
  repository operation without granting capability, permission, authorization,
  execution, or invocation.
scope:
  include:
    - Canonical Operation Requirement specification and terminology
    - Exact two-field structural schema and deterministic semantic validation
    - Pure frozen runtime values, schema resources, tests, packaging, and documentation
    - Architect design lock and final review, independent review, Gate evidence, Human approval, and Task closure
  exclude:
    - Task, Assignment, candidate, Runtime Option, or Project Manifest contract changes
    - Runtime capability, environment permission, authorization, tool binding, execution, or invocation semantics
    - Persistence, registry, CLI, adapter, Provider, permission changes, and target access
    - AIO-030, AIO-037, historical Task edits, push, merge, tag, release, or publication
dependencies:
  - AIO-035
quality_gates:
  - documentation_consistency
  - independent_review
human_control:
  final_review_required: true
  architecture_changes_require_approval: true
  breaking_schema_changes_require_approval: true
  breaking_contract_changes_require_approval: true
