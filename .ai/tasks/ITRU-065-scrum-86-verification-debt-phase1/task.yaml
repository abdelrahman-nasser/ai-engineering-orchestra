id: ITRU-065
title: Core verification debt Phase 1 - CLI help expectation drift
type: bugfix
status: completed
complexity: medium
risk: low
execution:
  mode: standard
workflow: standard-change
objective: >
  Inventory retained Core verification failures and remediate only the stale
  nonsecurity CLI help expectation against the already approved Alpha command
  surface, with deterministic offline before/after evidence and independent review.
scope:
