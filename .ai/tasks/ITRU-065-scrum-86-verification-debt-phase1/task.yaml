    - Phase 1 canonical Task, durable report, inventory and verification receipts
    - Independent test-integrity/security and contract/documentation reviews
    - Human-approved ITRU-065-only closure documentation and lifecycle bookkeeping
  exclude:
    - Production/runtime code, execution semantics, contracts and architecture changes
    - Native ACL/storage, privileged, containment and hazardous security probes
    - Network, provider requests, dependency installation and broad test discovery
    - Packaging, migration, namespace, Journal and fixture remediation in this slice
    - Completed SCRUM-83, SCRUM-87 and other historical Task changes
    - Operational Core-to-UI integration, Lane B and Option D changes
    - Stage/commit beyond the authorized checkpoint and single final closure commit
    - Push, merge, PR, tag, release, deployment and publication
    - Closing Jira SCRUM-86 or starting Phase 2
dependencies: []
quality_gates:
  - documentation_consistency
  - independent_review
human_control:
  final_review_required: true
  architecture_changes_require_approval: true
  breaking_schema_changes_require_approval: true
  breaking_contract_changes_require_approval: true
