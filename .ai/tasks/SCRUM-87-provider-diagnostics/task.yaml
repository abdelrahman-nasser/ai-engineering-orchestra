id: SCRUM-87
title: Safe Developer Alpha provider diagnostics and recovery
type: implementation
status: completed
complexity: medium
risk: medium
execution:
  mode: standard
workflow: security-sensitive-change
objective: >
  Provide safe offline CLI configuration diagnostics and actionable provider
  recovery without changing execution, approval or canonical Core contracts.
  Record the October 20, 2026 final Human acceptance and verified Task closure
  of the accepted implementation checkpoint without changing its product scope.
scope:
  include:
    - Alpha-only provider configuration validation and offline diagnose command
    - Fixed sanitized Alpha CLI errors and provider failure recovery messages
    - Focused deterministic offline tests and current first-run documentation
    - New Task evidence and independent security and CLI usability reviews
    - Human-approved final Task closure records and one local closure-only commit
  exclude:
    - Network requests, live inference and operational Core-to-UI integration
    - Changes to canonical Task, Run, Result, Journal or approval contracts
    - Completed P0 Task records and SCRUM-86 Core verification remediation
    - Further commits, push, merge, PR, tag, release, deployment and publication
dependencies: []
quality_gates:
  - documentation_consistency
  - independent_review
human_control:
  final_review_required: true
  architecture_changes_require_approval: true
  breaking_schema_changes_require_approval: true
  breaking_contract_changes_require_approval: true
