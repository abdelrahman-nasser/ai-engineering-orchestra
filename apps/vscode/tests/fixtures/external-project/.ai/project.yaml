schema_version: "0.1"
project:
  id: synthetic-external-project
  name: Synthetic External Project
  type: framework
  lifecycle: greenfield
orchestra:
  version: "0.1.0"
complexity:
  default: medium
risk:
  default: medium
execution:
  default_mode: standard
human_control:
  final_review_required: true
  architecture_changes_require_approval: true
  breaking_schema_changes_require_approval: true
  breaking_contract_changes_require_approval: true
quality:
  require_independent_review: true
  require_documentation_consistency: true
agents:
  max_parallel: 1
  max_depth: 1
context:
  strategy: progressive
  prefer_relevant_only: true
project_rules:
  directory: ".ai/rules/"
tasks:
  directory: "governance/tasks/"
verification:
  checks:
    - id: synthetic-noop
      command:
        - python
        - --version
overrides:
  directory: ".ai/overrides/"
