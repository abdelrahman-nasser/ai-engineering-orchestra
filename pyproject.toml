[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-engineering-orchestra"
version = "0.1.0"
description = "Local CLI for AIO project inspection and declared verification"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6,<7", "jsonschema>=4,<5"]

[project.scripts]
aio = "engineering_orchestration.cli:main"

[tool.setuptools]
packages = ["engineering_orchestration", "engineering_orchestration._schemas"]
include-package-data = false

[tool.setuptools.package-dir]
"engineering_orchestration._schemas" = "schemas"

[tool.setuptools.package-data]
"engineering_orchestration._schemas" = ["task.schema.json", "workflow.schema.json", "project-manifest.schema.json"]
